plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.financialtracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.financialtracker"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'   // поворот фото с камеры по EXIF

    // MPAndroidChart для графиков (ОДНА ВЕРСИЯ)
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Gson для JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // ML Kit Text Recognition (работает офлайн, только латиница)
    implementation 'com.google.mlkit:text-recognition:16.0.0'

    // Tesseract OCR — распознавание кириллицы (название магазина, "ИТОГ")
    // языковые файлы лежат в app/src/main/assets/tessdata/
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.7.0'

    // ML Kit Barcode Scanning (для QR-кодов)
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'

    // Для работы с камерой
    implementation 'androidx.camera:camera-camera2:1.3.0'
    implementation 'androidx.camera:camera-lifecycle:1.3.0'
    implementation 'androidx.camera:camera-view:1.3.0'

    // Для улучшения качества изображения
    implementation 'com.github.yalantis:ucrop:2.2.8'
}